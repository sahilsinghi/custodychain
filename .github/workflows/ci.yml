name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (tamper cases, property tests, hostile inputs; local test TSA, no network)
        env:
          CUSTODY_KEY_PASSWORD: ci-only-test-password
        run: pytest -q
      - name: Multi-gigabyte evidence (sparse 10 GB image, flip one byte)
        run: pytest -q -m slow
