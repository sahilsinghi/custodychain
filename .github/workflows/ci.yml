name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (tamper cases, property tests, hostile inputs; local test TSA, no network)
        env:
          CUSTODY_KEY_PASSWORD: ci-only-test-password
        run: pytest -q
      - name: Multi-gigabyte evidence (sparse 10 GB image, flip one byte)
        run: pytest -q -m slow
